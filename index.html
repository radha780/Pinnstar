<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PinnStar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="logo">PinnStar</div>

    <form id="search-form">
      <input type="text" id="search-input" placeholder="Search pins..." autocomplete="off" />
      <button type="submit" id="search-btn">🔍</button>
    </form>

    <div class="nav-actions">
      <button id="dark-toggle">🌙 Dark Mode</button>
      <!-- BUG 4: Upload button triggers download function -->
      <button id="upload-btn" onclick="downloadImage()">⬆ Upload Pin</button>
      <button id="preview-test-btn" title="My uploads">🖼 My Uploads</button>
      <input type="file" id="file-input" accept="image/*" hidden />
    </div>
  </nav>

  <div id="upload-preview" class="upload-preview hidden">
    <img id="preview-img" src="" alt="preview" />
    <p id="preview-title"></p>
  </div>

  <main id="pin-container" class="pin-container"></main>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <span id="modal-close">&times;</span>
      <img id="modal-img" src="" alt="pin detail" />
      <h2 id="modal-title"></h2>
      <p id="modal-author"></p>
      <div class="modal-actions">
        <button class="like-btn" id="modal-like">❤ Like (<span id="like-count">0</span>)</button>
        <button class="save-btn" id="modal-save">Save Pin</button>
      </div>
    </div>
  </div>

  <div id="confetti-container"></div>

  <script src="script.js"></script>
</body>
</html>
